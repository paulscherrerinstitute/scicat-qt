name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release from main/master"
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      rpm_release_rhel8: ${{ steps.resolve.outputs.rpm_release_rhel8 }}
      rpm_release_rhel9: ${{ steps.resolve.outputs.rpm_release_rhel9 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manual release branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ] && [ "${GITHUB_REF_NAME}" != "master" ]; then
            echo "::error::Manual releases must be run from main or master."
            exit 1
          fi

      - name: Evaluate semantic release
        id: semantic
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npx --yes \
            -p semantic-release@24 \
            -p conventional-changelog-conventionalcommits@7 \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            semantic-release --dry-run 2>&1 | tee semantic-release.log

          version="$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+\S*' semantic-release.log | tail -n 1 || true)"
          if [ -n "$version" ]; then
            echo "release-version=$version" >> "$GITHUB_OUTPUT"
            echo "new-release-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "new-release-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build version
        id: resolve
        env:
          SEMANTIC_RELEASE_VERSION: ${{ steps.semantic.outputs.release-version }}
          SEMANTIC_RELEASE_PUBLISHED: ${{ steps.semantic.outputs.new-release-published }}
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          version="${latest_tag#v}"
          if [ -z "$version" ]; then
            version="0.0.0"
          fi

          publish=false
          if [ -n "$SEMANTIC_RELEASE_VERSION" ]; then
            version="$SEMANTIC_RELEASE_VERSION"
          fi

          if [ "$SEMANTIC_RELEASE_PUBLISHED" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "master" ]; }; then
              publish=true
            elif [ "$MANUAL_PUBLISH" = "true" ]; then
              publish=true
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = "true" ]; then
            echo "rpm_release_rhel8=1.el8" >> "$GITHUB_OUTPUT"
            echo "rpm_release_rhel9=1.el9" >> "$GITHUB_OUTPUT"
          else
            echo "rpm_release_rhel8=0.ci.${GITHUB_RUN_NUMBER}.el8" >> "$GITHUB_OUTPUT"
            echo "rpm_release_rhel9=0.ci.${GITHUB_RUN_NUMBER}.el9" >> "$GITHUB_OUTPUT"
          fi

      - name: Print resolved version
        run: |
          echo "version=${{ steps.resolve.outputs.version }}"
          echo "publish=${{ steps.resolve.outputs.publish }}"
          echo "rpm_release_rhel8=${{ steps.resolve.outputs.rpm_release_rhel8 }}"
          echo "rpm_release_rhel9=${{ steps.resolve.outputs.rpm_release_rhel9 }}"

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs:
      - resolve-version
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ccache cmake ninja qt
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      - name: Resolve cache inputs
        id: cache-inputs
        run: |
          echo "compiler=$(clang++ --version | shasum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "qt=$(brew list --versions qt | shasum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            ccache-${{ runner.os }}-${{ matrix.arch }}-${{ steps.cache-inputs.outputs.compiler }}-${{ steps.cache-inputs.outputs.qt }}-${{ hashFiles('.github/workflows/release.yml', 'CMakeLists.txt', 'PSIArchiver/CMakeLists.txt', 'PSIArchiver/**/*.cpp', 'PSIArchiver/**/*.h', 'PSIArchiver/**/*.ui', 'PSIArchiver/**/*.qrc') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-${{ steps.cache-inputs.outputs.compiler }}-${{ steps.cache-inputs.outputs.qt }}-
            ccache-${{ runner.os }}-${{ matrix.arch }}-

      - name: Configure
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCICAT_VERSION="${{ needs.resolve-version.outputs.version }}"

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Print compiler cache statistics
        run: ccache --show-stats

      - name: Package app bundle
        run: |
          app_path="build/release/PSIArchiver/SciCat.app"
          artifact_name="SciCat-macos-${{ matrix.arch }}"

          test -d "$app_path"
          macdeployqt "$app_path" -verbose=2
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --keepParent "$app_path" "${artifact_name}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciCat-macos-${{ matrix.arch }}
          path: SciCat-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-rhel9-rpm:
    name: Enterprise Linux 9 packages
    needs:
      - resolve-version
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-rhel9

    steps:
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y --setopt=install_weak_deps=False install \
            ccache \
            cmake \
            gcc-c++ \
            git \
            ninja-build \
            qt6-qtbase-devel \
            rpm-build

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Qt bundle paths
        id: qt-paths
        run: |
          qt_core_library="$(ldconfig -p | awk '/libQt6Core\.so\.6 \(libc6,x86-64\)/ {print $NF; exit}')"
          if [ -z "$qt_core_library" ]; then
            qt_core_library="$(rpm -ql qt6-qtbase | grep -E '/libQt6Core\.so\.6$' | head -n 1 || true)"
          fi
          if [ -z "$qt_core_library" ]; then
            echo "::error::Unable to locate libQt6Core.so.6"
            exit 1
          fi
          qt_library_dir="$(dirname "$qt_core_library")"

          qt_plugin_dir="$(qtpaths6 --plugin-dir 2>/dev/null || /usr/lib64/qt6/bin/qtpaths --plugin-dir 2>/dev/null || true)"
          if [ -z "$qt_plugin_dir" ]; then
            qt_plugin_dir="/usr/lib64/qt6/plugins"
          fi
          if [ ! -d "$qt_plugin_dir" ]; then
            echo "::error::Unable to locate Qt plugin directory: $qt_plugin_dir"
            exit 1
          fi

          echo "library_dir=$qt_library_dir" >> "$GITHUB_OUTPUT"
          echo "plugin_dir=$qt_plugin_dir" >> "$GITHUB_OUTPUT"

      - name: Resolve cache inputs
        id: cache-inputs
        run: |
          echo "compiler=$(g++ --version | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "qt=$(rpm -q qt6-qtbase-devel | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache-rhel9
          key: >-
            ccache-rhel9-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.compiler }}-${{ steps.cache-inputs.outputs.qt }}-${{ hashFiles('.github/workflows/release.yml', 'CMakeLists.txt', 'PSIArchiver/CMakeLists.txt', 'cmake/**', 'PSIArchiver/**/*.cpp', 'PSIArchiver/**/*.h', 'PSIArchiver/**/*.ui', 'PSIArchiver/**/*.qrc') }}
          restore-keys: |
            ccache-rhel9-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.compiler }}-${{ steps.cache-inputs.outputs.qt }}-
            ccache-rhel9-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats
          cmake -S . -B build/rhel9 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCICAT_PACKAGE_GENERATORS=RPM \
            -DSCICAT_PACKAGE_SUFFIX=rhel9-x86_64 \
            -DSCICAT_PACKAGE_RELEASE="${{ needs.resolve-version.outputs.rpm_release_rhel9 }}" \
            -DSCICAT_VERSION="${{ needs.resolve-version.outputs.version }}"

      - name: Build
        run: cmake --build build/rhel9 --config Release --parallel

      - name: Print compiler cache statistics
        run: ccache --show-stats

      - name: Build RPM
        run: |
          cmake --build build/rhel9 --target package
          mkdir -p dist/rhel9
          find build/rhel9 -maxdepth 1 -type f -name '*.rpm' -exec mv {} dist/rhel9/ \;
          test -n "$(find dist/rhel9 -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          rpm -qpi dist/rhel9/*.rpm
          rpm -qpl dist/rhel9/*.rpm

      - name: Upload RHEL9 RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciCat-rhel9-rpm
          path: dist/rhel9/*.rpm
          if-no-files-found: error

      - name: Configure Linux archive
        run: |
          cmake -S . -B build/rhel9-archive -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCICAT_BUNDLE_QT_RUNTIME=ON \
            -DSCICAT_INSTALL_SYSTEM_INTEGRATION=OFF \
            -DSCICAT_BUNDLED_QT_LIBRARY_DIR="${{ steps.qt-paths.outputs.library_dir }}" \
            -DSCICAT_BUNDLED_QT_PLUGIN_DIR="${{ steps.qt-paths.outputs.plugin_dir }}" \
            -DSCICAT_PACKAGE_GENERATORS=TGZ \
            -DSCICAT_PACKAGE_SUFFIX=rhel9-x86_64 \
            -DSCICAT_VERSION="${{ needs.resolve-version.outputs.version }}"

      - name: Build Linux archive
        run: |
          cmake --build build/rhel9-archive --config Release --parallel
          cmake --build build/rhel9-archive --target package
          find build/rhel9-archive -maxdepth 1 -type f -name '*.tar.gz' -exec mv {} dist/rhel9/ \;
          test -n "$(find dist/rhel9 -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          tar -tzf dist/rhel9/*.tar.gz | sed -n '1,40p'

      - name: Upload RHEL9 Linux archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciCat-rhel9-linux-archive
          path: dist/rhel9/*.tar.gz
          if-no-files-found: error

  build-rhel8-rpm:
    name: Enterprise Linux 8 packages
    needs:
      - resolve-version
    runs-on: ubuntu-24.04
    container:
      image: almalinux:8
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-rhel8

    steps:
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled PowerTools
          dnf copr enable -y laridae/qt6
          dnf -y --setopt=install_weak_deps=False install \
            ccache \
            cmake \
            gcc-c++ \
            git \
            ninja-build \
            qt6-qtbase-devel \
            rpm-build

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Qt bundle paths
        id: qt-paths
        run: |
          qt_core_library="$(ldconfig -p | awk '/libQt6Core\.so\.6 \(libc6,x86-64\)/ {print $NF; exit}')"
          if [ -z "$qt_core_library" ]; then
            qt_core_library="$(rpm -ql qt6-qtbase | grep -E '/libQt6Core\.so\.6$' | head -n 1 || true)"
          fi
          if [ -z "$qt_core_library" ]; then
            echo "::error::Unable to locate libQt6Core.so.6"
            exit 1
          fi
          qt_library_dir="$(dirname "$qt_core_library")"

          qt_plugin_dir="$(qtpaths6 --plugin-dir 2>/dev/null || /usr/lib64/qt6/bin/qtpaths --plugin-dir 2>/dev/null || true)"
          if [ -z "$qt_plugin_dir" ]; then
            qt_plugin_dir="/usr/lib64/qt6/plugins"
          fi
          if [ ! -d "$qt_plugin_dir" ]; then
            echo "::error::Unable to locate Qt plugin directory: $qt_plugin_dir"
            exit 1
          fi

          echo "library_dir=$qt_library_dir" >> "$GITHUB_OUTPUT"
          echo "plugin_dir=$qt_plugin_dir" >> "$GITHUB_OUTPUT"

      - name: Resolve cache inputs
        id: cache-inputs
        run: |
          echo "compiler=$(g++ --version | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "qt=$(rpm -q qt6-qtbase-devel | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache-rhel8
          key: >-
            ccache-rhel8-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.compiler }}-${{ steps.cache-inputs.outputs.qt }}-${{ hashFiles('.github/workflows/release.yml', 'CMakeLists.txt', 'PSIArchiver/CMakeLists.txt', 'cmake/**', 'PSIArchiver/**/*.cpp', 'PSIArchiver/**/*.h', 'PSIArchiver/**/*.ui', 'PSIArchiver/**/*.qrc') }}
          restore-keys: |
            ccache-rhel8-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.compiler }}-${{ steps.cache-inputs.outputs.qt }}-
            ccache-rhel8-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats
          cmake -S . -B build/rhel8 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/scicat \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCICAT_BUNDLE_QT_RUNTIME=ON \
            -DSCICAT_BUNDLED_QT_LIBRARY_DIR="${{ steps.qt-paths.outputs.library_dir }}" \
            -DSCICAT_BUNDLED_QT_PLUGIN_DIR="${{ steps.qt-paths.outputs.plugin_dir }}" \
            -DSCICAT_PACKAGE_GENERATORS=RPM \
            -DSCICAT_PACKAGE_SUFFIX=rhel8-x86_64 \
            -DSCICAT_PACKAGE_RELEASE="${{ needs.resolve-version.outputs.rpm_release_rhel8 }}" \
            -DSCICAT_VERSION="${{ needs.resolve-version.outputs.version }}"

      - name: Build
        run: cmake --build build/rhel8 --config Release --parallel

      - name: Print compiler cache statistics
        run: ccache --show-stats

      - name: Build RPM
        run: |
          cmake --build build/rhel8 --target package
          mkdir -p dist/rhel8
          find build/rhel8 -maxdepth 1 -type f -name '*.rpm' -exec mv {} dist/rhel8/ \;
          test -n "$(find dist/rhel8 -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          rpm -qpi dist/rhel8/*.rpm
          rpm -qpl dist/rhel8/*.rpm

      - name: Upload RHEL8 RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciCat-rhel8-rpm
          path: dist/rhel8/*.rpm
          if-no-files-found: error

      - name: Configure Linux archive
        run: |
          cmake -S . -B build/rhel8-archive -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCICAT_BUNDLE_QT_RUNTIME=ON \
            -DSCICAT_INSTALL_SYSTEM_INTEGRATION=OFF \
            -DSCICAT_BUNDLED_QT_LIBRARY_DIR="${{ steps.qt-paths.outputs.library_dir }}" \
            -DSCICAT_BUNDLED_QT_PLUGIN_DIR="${{ steps.qt-paths.outputs.plugin_dir }}" \
            -DSCICAT_PACKAGE_GENERATORS=TGZ \
            -DSCICAT_PACKAGE_SUFFIX=rhel8-x86_64 \
            -DSCICAT_VERSION="${{ needs.resolve-version.outputs.version }}"

      - name: Build Linux archive
        run: |
          cmake --build build/rhel8-archive --config Release --parallel
          cmake --build build/rhel8-archive --target package
          find build/rhel8-archive -maxdepth 1 -type f -name '*.tar.gz' -exec mv {} dist/rhel8/ \;
          test -n "$(find dist/rhel8 -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          tar -tzf dist/rhel8/*.tar.gz | sed -n '1,40p'

      - name: Upload RHEL8 Linux archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciCat-rhel8-linux-archive
          path: dist/rhel8/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Semantic release
    needs:
      - resolve-version
      - build-macos
      - build-rhel8-rpm
      - build-rhel9-rpm
    if: needs.resolve-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --yes \
            -p semantic-release@24 \
            -p conventional-changelog-conventionalcommits@7 \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            semantic-release
