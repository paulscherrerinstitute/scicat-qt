name: Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ccache cmake ninja qt
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      - name: Resolve cache inputs
        id: cache-inputs
        run: |
          echo "compiler=$(clang++ --version | shasum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "qt=$(brew list --versions qt | shasum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            ccache-${{ runner.os }}-${{ matrix.arch }}-${{ steps.cache-inputs.outputs.compiler }}-${{ steps.cache-inputs.outputs.qt }}-${{ hashFiles('.github/workflows/release.yml', 'CMakeLists.txt', 'PSIArchiver/CMakeLists.txt', 'PSIArchiver/**/*.cpp', 'PSIArchiver/**/*.h', 'PSIArchiver/**/*.ui', 'PSIArchiver/**/*.qrc') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-${{ steps.cache-inputs.outputs.compiler }}-${{ steps.cache-inputs.outputs.qt }}-
            ccache-${{ runner.os }}-${{ matrix.arch }}-

      - name: Resolve build version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "SCICAT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCICAT_VERSION="$SCICAT_VERSION"

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Print compiler cache statistics
        run: ccache --show-stats

      - name: Package app bundle
        run: |
          app_path="build/release/PSIArchiver/SciCat.app"
          artifact_name="SciCat-macos-${{ matrix.arch }}"

          test -d "$app_path"
          macdeployqt "$app_path" -verbose=2
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --keepParent "$app_path" "${artifact_name}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciCat-macos-${{ matrix.arch }}
          path: SciCat-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs:
      - build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --title "$TAG_NAME" \
              --notes "Automated SciCat macOS release."
          fi
